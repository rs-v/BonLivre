name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Build and Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore BonLiver.sln

    - name: Build
      run: dotnet build BonLiver.sln --no-restore --configuration Release

    - name: Check format
      run: dotnet format --verify-no-changes --no-restore
      continue-on-error: true

  frontend:
    name: Frontend Build and Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Install dependencies
      working-directory: ./web-svelte
      run: pnpm install

    - name: Check (svelte-check)
      working-directory: ./web-svelte
      run: pnpm run check

    - name: Build
      working-directory: ./web-svelte
      run: pnpm run build

    - name: Upload frontend artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: ./web-svelte/dist
        retention-days: 7

  package:
    name: Package ${{ matrix.rid }}
    needs: [ backend, frontend ]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rid: linux-x64
          - os: windows-latest
            rid: win-x64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Install Native AOT prerequisites (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

    - name: Restore dependencies
      run: dotnet restore BonLivre.csproj --runtime ${{ matrix.rid }}

    - name: Publish (Native AOT + bundled frontend)
      run: dotnet publish BonLivre.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained --no-restore --output ./publish/${{ matrix.rid }}

    - name: Report package size
      shell: pwsh
      run: |
        $publishDir = "./publish/${{ matrix.rid }}"
        $files = Get-ChildItem $publishDir -Recurse -File
        $totalBytes = ($files | Measure-Object Length -Sum).Sum
        Write-Host ("Total publish size: {0:N2} MB" -f ($totalBytes / 1MB))
        $files |
          Sort-Object Length -Descending |
          Select-Object -First 10 FullName, @{ Name = 'SizeMB'; Expression = { [math]::Round($_.Length / 1MB, 2) } } |
          Format-Table -AutoSize

    - name: Upload package artifact
      uses: actions/upload-artifact@v4
      with:
        name: bonlivre-${{ matrix.rid }}
        path: ./publish/${{ matrix.rid }}
        retention-days: 7

  build-success:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [ backend, frontend, package ]

    steps:
    - name: Success
      run: echo "All builds and checks completed successfully!"

  release:
    name: Release changed build
    runs-on: ubuntu-latest
    needs: [ build-success ]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check for changes since the latest release
      id: changes
      shell: bash
      run: |
        git fetch --tags --force
        latest_tag="$(git tag --sort=-version:refname | head -n 1)"
        if [ -n "$latest_tag" ]; then
          commit_count="$(git rev-list "${latest_tag}..HEAD" --count)"
        else
          commit_count="$(git rev-list HEAD --count)"
        fi

        release_tag="v$(date -u +%Y.%m.%d)"
        if git rev-parse --verify --quiet "refs/tags/${release_tag}" >/dev/null; then
          echo "A release for ${release_tag} already exists."
          commit_count=0
        fi

        echo "latest_tag=${latest_tag}" >> "$GITHUB_OUTPUT"
        echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
        echo "commit_count=${commit_count}" >> "$GITHUB_OUTPUT"
        echo "should_release=$([ "$commit_count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    - name: Download packages
      if: steps.changes.outputs.should_release == 'true'
      uses: actions/download-artifact@v4
      with:
        pattern: bonlivre-*
        path: release-assets
        merge-multiple: false

    - name: Archive packages
      if: steps.changes.outputs.should_release == 'true'
      shell: bash
      run: |
        mkdir -p release-files
        for directory in release-assets/bonlivre-*; do
          archive="release-files/$(basename "$directory").zip"
          (cd "$directory" && zip -qr "../../$archive" .)
        done

    - name: Create GitHub release
      if: steps.changes.outputs.should_release == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ steps.changes.outputs.release_tag }}
      run: |
        gh release create "$RELEASE_TAG" release-files/*.zip \
          --title "BonLivre $RELEASE_TAG" \
          --generate-notes

    - name: Report no release needed
      if: steps.changes.outputs.should_release != 'true'
      run: echo "No unreleased changes found."
